name: Publish RTO source

on:
  push:
    paths:
      - ".github/workflows/publish-rto-source.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand packaged source
        run: unzip -q -o rto/read-to-output-pi.zip -d rto

      - name: Commit readable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rto
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish RTO source code"
          git push
